<!DOCTYPE html>
<html>
<head>
    <title>Theme Toggle Application</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .light {
            background-color: #ffffff;
            color: #222222;
        }

        .dark {
            background-color: #121212;
            color: #f5f5f5;
        }

        .container {
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Blog Theme Toggle</h2>
        <p>Click the button to switch theme.</p>
        <button id="themeToggleBtn">Switch Theme</button>
    </div>

    <script>
        const body = document.body;
        const toggleBtn = document.getElementById("themeToggleBtn");
        const loadTheme = () => {
            const savedTheme = localStorage.getItem("theme") || "light";
            body.classList.add(savedTheme);
        };
        const toggleTheme = () => {
            const isDark = body.classList.contains("dark");

            body.classList.remove(isDark ? "dark" : "light");
            body.classList.add(isDark ? "light" : "dark");

            localStorage.setItem("theme", isDark ? "light" : "dark");
        };
        toggleBtn.addEventListener("click", toggleTheme);
        loadTheme();
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Student Profile Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            margin-top: 40px;
        }

        .profile-card {
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #46087d;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .profile-card h3 {
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            margin: 10px 5px;
            cursor: pointer;
        }

        input {
            padding: 6px;
            width: 120px;
        }
    </style>
</head>
<body>

    <h2>Student Profile Manager</h2>

    <div id="profileContainer"></div>

    <input type="number" id="newMarksInput" placeholder="Enter new marks">
    <button id="updateMarksBtn">Update Marks</button>

    <script>
        var student = {
            name: "Mithra",
            rollNo: 2,
            marks: 80
        };
        function updateStudentProfile(studentObj) {
            var container = document.getElementById("profileContainer");
            container.innerHTML =
                "<div class='profile-card'>" +
                "<h3>Student Details</h3>" +
                "<p><strong>Name:</strong> " + studentObj.name + "</p>" +
                "<p><strong>Roll No:</strong> " + studentObj.rollNo + "</p>" +
                "<p><strong>Marks:</strong> " + studentObj.marks + "</p>" +
                "</div>";
        }
        function updateMarks(newMarks) {

            student.marks = newMarks; 
            updateStudentProfile(student);
        }
        document.getElementById("updateMarksBtn")
            .addEventListener("click", function() {

                var newMarksValue = document.getElementById("newMarksInput").value;

                if (newMarksValue !== "") {
                    updateMarks(Number(newMarksValue));
                }
            });

        updateStudentProfile(student);

    </script>

</body>
</html>

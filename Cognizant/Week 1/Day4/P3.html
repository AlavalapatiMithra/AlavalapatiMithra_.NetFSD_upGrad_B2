<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Signal Simulator</title>
</head>
<body>

    <h2>Open Console to See Signal Instruction</h2>

    <script>

        let signal = "yellow";
        switch (signal) {

            case "red":
                console.log("Stop");
                break;

            case "yellow":
                console.log("Get Ready");
                break;

            case "green":
                console.log("Go");
                break;

            default:
                console.log("Invalid signal color");
        }

    </script>

</body>
</html>
